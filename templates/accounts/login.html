{% load static %}
<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Armada</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
  <!-- 登录页跟随用户在主应用里保存的主题；提前同步执行避免闪烁 -->
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      background: oklch(var(--b1));
      color: oklch(var(--bc));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      overflow: hidden;
    }

    /* 左侧视觉面板 */
    .visual-panel {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: oklch(var(--b2));
      overflow: hidden;
    }

    /* 微妙的渐变光晕，用主题主色驱动 */
    .visual-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, oklch(var(--p) / 0.10) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, oklch(var(--s) / 0.08) 0%, transparent 50%);
    }

    /* 精致的网格背景 */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(oklch(var(--bc) / 0.03) 1px, transparent 1px),
        linear-gradient(90deg, oklch(var(--bc) / 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 40%, transparent 100%);
    }

    .visual-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 2rem;
      border-radius: 16px;
      background: linear-gradient(135deg, oklch(var(--p)) 0%, oklch(var(--s)) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px oklch(var(--p) / 0.25);
    }

    .brand-icon i {
      font-size: 2rem;
      color: oklch(var(--pc));
    }

    .visual-content h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      color: oklch(var(--bc));
    }

    .visual-content p {
      font-size: 1.05rem;
      color: oklch(var(--bc) / 0.55);
      line-height: 1.7;
    }

    .feature-list {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: oklch(var(--bc) / 0.65);
      font-size: 0.9rem;
    }

    .feature-item i {
      color: oklch(var(--p));
      font-size: 0.75rem;
    }

    /* 右侧登录面板 */
    .login-panel {
      width: 460px;
      min-width: 460px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem 2.5rem;
      background: oklch(var(--b1));
      border-left: 1px solid oklch(var(--bc) / 0.08);
    }

    .login-header { margin-bottom: 2.5rem; }

    .login-title {
      font-size: 1.75rem;
      font-weight: 600;
      color: oklch(var(--bc));
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: oklch(var(--bc) / 0.5);
    }

    .form-group { margin-bottom: 1.5rem; }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: oklch(var(--bc) / 0.7);
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid oklch(var(--bc) / 0.15);
      background: oklch(var(--b2));
      color: oklch(var(--bc));
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .form-input::placeholder { color: oklch(var(--bc) / 0.35); }

    .form-input:focus {
      border-color: oklch(var(--p));
      background: oklch(var(--b1));
      box-shadow: 0 0 0 3px oklch(var(--p) / 0.12);
    }

    .password-wrap { position: relative; }
    .password-wrap .form-input { padding-right: 44px; }

    .password-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: oklch(var(--bc) / 0.5);
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .password-toggle:hover {
      color: oklch(var(--bc) / 0.8);
      background: oklch(var(--bc) / 0.06);
    }

    .password-toggle:focus { outline: none; color: oklch(var(--p)); }

    .login-btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: oklch(var(--p));
      color: oklch(var(--pc));
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.15s ease, box-shadow 0.15s ease;
      margin-top: 0.5rem;
    }

    .login-btn:hover {
      filter: brightness(1.08);
      box-shadow: 0 4px 12px oklch(var(--p) / 0.3);
    }

    .error-box {
      padding: 0.875rem 1rem;
      border-radius: 8px;
      background: oklch(var(--er) / 0.10);
      border: 1px solid oklch(var(--er) / 0.20);
      color: oklch(var(--er));
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      line-height: 1.5;
    }

    .error-box i { margin-top: 2px; flex-shrink: 0; }

    .login-footer {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid oklch(var(--bc) / 0.08);
      text-align: center;
      font-size: 0.8rem;
      color: oklch(var(--bc) / 0.4);
    }

    /* 响应式 */
    @media (max-width: 1024px) {
      .visual-panel { display: none; }
      .login-panel {
        width: 100%;
        min-width: unset;
        max-width: 420px;
        margin: 0 auto;
        border: 1px solid oklch(var(--bc) / 0.08);
        border-radius: 16px;
      }
      body {
        justify-content: center;
        background: oklch(var(--b2));
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- 左侧视觉面板 -->
  <div class="visual-panel">
    <div class="grid-bg"></div>

    <div class="visual-content">
      <div class="brand-icon">
        <i class="fas fa-dharmachakra"></i>
      </div>
      <h1>Armada</h1>
      <p>企业级 Kubernetes 多集群管理平台</p>

      <div class="feature-list">
        <div class="feature-item">
          <i class="fas fa-check-circle"></i>
          <span>统一管理多个 K8s 集群</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-check-circle"></i>
          <span>实时监控资源与性能指标</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-check-circle"></i>
          <span>细粒度权限控制与审计</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 右侧登录面板 -->
  <div class="login-panel">
    <div class="login-header">
      <div class="login-title">登录</div>
      <div class="login-subtitle">使用您的账号访问 Armada 控制台</div>
    </div>

    {% if error %}
    <div class="error-box">
      <i class="fas fa-exclamation-circle"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-input" placeholder="输入用户名" value="{{ username|default:'' }}" required {% if not username %}autofocus{% endif %}>
      </div>

      <div class="form-group">
        <label class="form-label">密码</label>
        <div class="password-wrap">
          <input type="password" name="password" id="password-input" class="form-input" placeholder="输入密码" required {% if username %}autofocus{% endif %}>
          <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="显示/隐藏密码" tabindex="-1">
            <i class="fas fa-eye" id="password-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn">
        登录
      </button>
    </form>

    <script>
      function togglePassword() {
        const input = document.getElementById('password-input');
        const icon = document.getElementById('password-eye');
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        icon.classList.toggle('fa-eye', !isHidden);
        icon.classList.toggle('fa-eye-slash', isHidden);
      }
    </script>

    <div class="login-footer">
      Armada v1.0 · Kubernetes Multi-Cluster Management
    </div>
  </div>

</body>
</html>
