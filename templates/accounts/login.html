{% load static %}
{% load static_version %}
<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Armada</title>
  <link rel="stylesheet" href="{% static_v 'css/output.css' %}">
  <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
  <link rel="stylesheet" href="{% static_v 'css/armada-fx.css' %}">
  <!-- 登录页跟随用户在主应用里保存的主题；提前同步执行避免闪烁 -->
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      background: var(--color-base-100);
      color: var(--color-base-content);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      overflow: hidden;
    }

    /* 左侧视觉面板 */
    .visual-panel {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-base-200);
      overflow: hidden;
    }

    /* 持续漂移的渐变光晕，用主题主色驱动。
       登录页 body 是不透明的 base-100，盖住了 armada-fx.css 的全局光晕，
       所以这里自带一份动效。 */
    .visual-panel::before {
      content: '';
      position: absolute;
      inset: -25%;
      background:
        radial-gradient(closest-side at 22% 30%, color-mix(in oklab, var(--color-primary) 18%, transparent) 0%, transparent 100%),
        radial-gradient(closest-side at 78% 70%, color-mix(in oklab, var(--color-secondary) 15%, transparent) 0%, transparent 100%),
        radial-gradient(closest-side at 55% 15%, color-mix(in oklab, var(--color-accent) 10%, transparent) 0%, transparent 100%);
      filter: blur(30px);
      animation: login-aurora 22s ease-in-out infinite alternate;
    }

    @keyframes login-aurora {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      50%  { transform: translate3d(3%, -2.5%, 0) scale(1.08); }
      100% { transform: translate3d(-2%, 3%, 0) scale(1.04); }
    }

    /* 网格缓慢平移，给静态页面一点生命感 */
    .grid-bg { animation: login-grid 34s linear infinite; }

    @keyframes login-grid {
      from { background-position: 0 0, 0 0; }
      to   { background-position: 80px 80px, 80px 80px; }
    }

    /* 品牌图标：色相持续流动 + 悬浮 */
    .brand-icon {
      background-size: 300% 300%;
      animation: login-flow 7s ease infinite, login-float 5s ease-in-out infinite;
    }

    @keyframes login-flow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes login-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-7px); }
    }

    /* 标题渐变流动 */
    .visual-content h1 {
      background: linear-gradient(100deg,
        var(--color-base-content) 15%,
        var(--color-primary) 45%,
        var(--color-secondary) 60%,
        var(--color-base-content) 85%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: login-flow 9s ease infinite;
    }

    /* 登录按钮：光泽扫过 */
    .login-btn { position: relative; overflow: hidden; }
    .login-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -120%;
      width: 55%; height: 100%;
      background: linear-gradient(100deg, transparent,
        color-mix(in oklab, white 38%, transparent), transparent);
      transition: left 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .login-btn:hover::after { left: 130%; }

    /* 特性项：依次浮现 */
    .feature-item { animation: login-rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .feature-item:nth-child(1) { animation-delay: 0.15s; }
    .feature-item:nth-child(2) { animation-delay: 0.28s; }
    .feature-item:nth-child(3) { animation-delay: 0.41s; }

    @keyframes login-rise {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .visual-panel::before,
      .grid-bg,
      .brand-icon,
      .visual-content h1,
      .feature-item { animation: none; }
      .visual-content h1 {
        background: none;
        -webkit-text-fill-color: currentColor;
      }
      .login-btn::after { display: none; }
    }

    /* 精致的网格背景 */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(color-mix(in oklab, var(--color-base-content) 3%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in oklab, var(--color-base-content) 3%, transparent) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 40%, transparent 100%);
    }

    .visual-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 2rem;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px color-mix(in oklab, var(--color-primary) 25%, transparent);
    }

    .brand-icon i {
      font-size: 2rem;
      color: var(--color-primary-content);
    }

    .visual-content h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      color: var(--color-base-content);
    }

    .visual-content p {
      font-size: 1.05rem;
      color: color-mix(in oklab, var(--color-base-content) 55%, transparent);
      line-height: 1.7;
    }

    .feature-list {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: color-mix(in oklab, var(--color-base-content) 65%, transparent);
      font-size: 0.9rem;
    }

    .feature-item i {
      color: var(--color-primary);
      font-size: 0.75rem;
    }

    /* 右侧登录面板 */
    .login-panel {
      width: 460px;
      min-width: 460px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem 2.5rem;
      background: var(--color-base-100);
      border-left: 1px solid color-mix(in oklab, var(--color-base-content) 8%, transparent);
    }

    .login-header { margin-bottom: 2.5rem; }

    .login-title {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--color-base-content);
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: color-mix(in oklab, var(--color-base-content) 50%, transparent);
    }

    .form-group { margin-bottom: 1.5rem; }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: color-mix(in oklab, var(--color-base-content) 70%, transparent);
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid color-mix(in oklab, var(--color-base-content) 15%, transparent);
      background: var(--color-base-200);
      color: var(--color-base-content);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .form-input::placeholder { color: color-mix(in oklab, var(--color-base-content) 35%, transparent); }

    .form-input:focus {
      border-color: var(--color-primary);
      background: var(--color-base-100);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--color-primary) 12%, transparent);
    }

    .password-wrap { position: relative; }
    .password-wrap .form-input { padding-right: 44px; }

    .password-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: color-mix(in oklab, var(--color-base-content) 50%, transparent);
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .password-toggle:hover {
      color: color-mix(in oklab, var(--color-base-content) 80%, transparent);
      background: color-mix(in oklab, var(--color-base-content) 6%, transparent);
    }

    .password-toggle:focus { outline: none; color: var(--color-primary); }

    .login-btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: var(--color-primary);
      color: var(--color-primary-content);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.15s ease, box-shadow 0.15s ease;
      margin-top: 0.5rem;
    }

    .login-btn:hover {
      filter: brightness(1.08);
      box-shadow: 0 4px 12px color-mix(in oklab, var(--color-primary) 30%, transparent);
    }

    .error-box {
      padding: 0.875rem 1rem;
      border-radius: 8px;
      background: color-mix(in oklab, var(--color-error) 10%, transparent);
      border: 1px solid color-mix(in oklab, var(--color-error) 20%, transparent);
      color: var(--color-error);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      line-height: 1.5;
    }

    .error-box i { margin-top: 2px; flex-shrink: 0; }

    .login-footer {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid color-mix(in oklab, var(--color-base-content) 8%, transparent);
      text-align: center;
      font-size: 0.8rem;
      color: color-mix(in oklab, var(--color-base-content) 40%, transparent);
    }

    /* 响应式 */
    @media (max-width: 1024px) {
      .visual-panel { display: none; }
      .login-panel {
        width: 100%;
        min-width: unset;
        max-width: 420px;
        margin: 0 auto;
        border: 1px solid color-mix(in oklab, var(--color-base-content) 8%, transparent);
        border-radius: 16px;
      }
      body {
        justify-content: center;
        background: var(--color-base-200);
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- 左侧视觉面板 -->
  <div class="visual-panel">
    <div class="grid-bg"></div>

    <div class="visual-content">
      <div class="brand-icon">
        <i class="fas fa-dharmachakra"></i>
      </div>
      <h1>Armada</h1>
      <p>企业级 Kubernetes 多集群管理平台</p>

      <div class="feature-list">
        <div class="feature-item">
          <i class="fas fa-check-circle"></i>
          <span>统一管理多个 K8s 集群</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-check-circle"></i>
          <span>实时监控资源与性能指标</span>
        </div>
        <div class="feature-item">
          <i class="fas fa-check-circle"></i>
          <span>细粒度权限控制与审计</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 右侧登录面板 -->
  <div class="login-panel">
    <div class="login-header">
      <div class="login-title">登录</div>
      <div class="login-subtitle">使用您的账号访问 Armada 控制台</div>
    </div>

    {% if error %}
    <div class="error-box">
      <i class="fas fa-exclamation-circle"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-input" placeholder="输入用户名" value="{{ username|default:'' }}" required {% if not username %}autofocus{% endif %}>
      </div>

      <div class="form-group">
        <label class="form-label">密码</label>
        <div class="password-wrap">
          <input type="password" name="password" id="password-input" class="form-input" placeholder="输入密码" required {% if username %}autofocus{% endif %}>
          <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="显示/隐藏密码" tabindex="-1">
            <i class="fas fa-eye" id="password-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn">
        登录
      </button>
    </form>

    <script>
      function togglePassword() {
        const input = document.getElementById('password-input');
        const icon = document.getElementById('password-eye');
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        icon.classList.toggle('fa-eye', !isHidden);
        icon.classList.toggle('fa-eye-slash', isHidden);
      }
    </script>

    <div class="login-footer">
      Armada v1.0 · Kubernetes Multi-Cluster Management
    </div>
  </div>

</body>
</html>
